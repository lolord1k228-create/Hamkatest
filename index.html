<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hamka Kombat</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1e; color: #fff; user-select: none;
    }
    body {
      display: flex; flex-direction: column; position: relative;
      background:
        radial-gradient(circle at 50% 20%, rgba(245, 166, 35, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 50% 100%, rgba(76, 175, 80, 0.1) 0%, transparent 50%),
        #0f0f1e;
    }

    /* ===== Авторизація ===== */
    #auth-screen {
      position: fixed; inset: 0; z-index: 1000; background: #0f0f1e;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; transition: opacity 0.3s, visibility 0.3s;
    }
    #auth-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .auth-logo { font-size: 72px; margin-bottom: 16px; }
    .auth-title { font-size: 24px; font-weight: 700; color: #f5a623; margin-bottom: 8px; }
    .auth-subtitle { font-size: 13px; color: #888; margin-bottom: 32px; text-align: center; }
    .auth-form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }
    .auth-input {
      width: 100%; padding: 14px 16px; background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
      color: #fff; font-size: 15px; outline: none;
    }
    .auth-input:focus { border-color: #f5a623; }
    .auth-input::placeholder { color: #666; }
    .auth-btn {
      padding: 14px; border: none; border-radius: 12px; font-size: 15px;
      font-weight: 700; cursor: pointer; transition: transform 0.1s, opacity 0.2s;
    }
    .auth-btn:active { transform: scale(0.97); }
    .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-btn.primary { background: linear-gradient(135deg, #f5a623, #d4891a); color: #1a1a2e; }
    .auth-btn.telegram {
      background: #2aabee; color: #fff; display: flex; align-items: center;
      justify-content: center; gap: 8px; margin-top: 8px;
    }
    .auth-divider {
      display: flex; align-items: center; gap: 12px; color: #555; font-size: 12px; margin: 8px 0;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.08);
    }
    .auth-switch { margin-top: 20px; font-size: 13px; color: #888; text-align: center; }
    .auth-switch a { color: #f5a623; cursor: pointer; text-decoration: none; font-weight: 600; }
    .auth-error { color: #ff6b6b; font-size: 12px; text-align: center; min-height: 18px; line-height: 1.4; }
    .auth-hint { color: #888; font-size: 11px; text-align: center; margin-top: 6px; line-height: 1.4; }

    /* ===== Гра ===== */
    #game-screen { display: none; flex-direction: column; height: 100%; }
    #game-screen.visible { display: flex; }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 5;
    }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, #f5a623, #d4891a);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; color: #1a1a2e;
      box-shadow: 0 0 12px rgba(245, 166, 35, 0.4);
    }
    .user-name { font-size: 14px; font-weight: 600; }
    .user-level {
      font-size: 11px; color: #f5a623; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .logout-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #aaa; padding: 6px 12px; border-radius: 8px;
      font-size: 12px; cursor: pointer;
    }

    .stats-bar {
      display: flex; justify-content: space-around;
      padding: 14px 12px; background: rgba(0, 0, 0, 0.25);
      margin: 10px 12px; border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .stat-item { text-align: center; flex: 1; }
    .stat-item + .stat-item { border-left: 1px solid rgba(255, 255, 255, 0.08); }
    .stat-label {
      font-size: 10px; color: #888; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 3px;
    }
    .stat-value { font-size: 17px; font-weight: 700; color: #f5a623; }
    .stat-value.coin { color: #ffd700; }
    .stat-value.energy { color: #4caf50; }

    /* ===== Вкладки ===== */
    .page { display: none; flex: 1; flex-direction: column; overflow-y: auto; }
    .page.active { display: flex; }

    /* ===== Тап ===== */
    .tap-area {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      position: relative; padding: 10px; overflow: hidden;
    }
    .hamster-wrap {
      position: relative; display: flex; align-items: center; justify-content: center;
      width: 420px; height: 420px;
      max-width: 100%; max-height: 100%;
    }
    .hamster-wrap::before {
      content: ''; position: absolute; width: 90%; height: 90%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 166, 35, 0.25), transparent 70%);
      animation: pulseGlow 2s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    .hamster {
      width: 380px; height: 380px;
      max-width: 100%; max-height: 100%;
      background: radial-gradient(circle at 35% 30%, #ffd27a, #f5a623 40%, #d4891a);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 170px; cursor: pointer; transition: transform 0.1s ease;
      box-shadow: 0 10px 40px rgba(245, 166, 35, 0.4),
        inset 0 -8px 20px rgba(0, 0, 0, 0.2),
        inset 0 8px 20px rgba(255, 255, 255, 0.3);
      position: relative; z-index: 2;
    }
    .hamster:active { transform: scale(0.92); }
    .tap-hint { margin-top: 24px; font-size: 13px; color: #888; text-align: center; }
    .tap-effect {
      position: absolute; font-size: 30px; font-weight: 800; color: #ffd700;
      pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 10;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-90px) scale(1.4); }
    }

    /* ===== Крипто ===== */
    .crypto-page { padding: 8px 12px 90px; }
    .crypto-title {
      font-size: 18px; font-weight: 700; color: #f5a623;
      text-align: center; margin: 8px 0 12px;
    }
    .crypto-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px; padding: 12px; margin-bottom: 10px;
    }
    .crypto-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .crypto-symbol { font-size: 16px; font-weight: 700; color: #f5a623; }
    .crypto-price { font-size: 15px; font-weight: 700; color: #fff; }
    .crypto-price.up { color: #4caf50; }
    .crypto-price.down { color: #ff5252; }
    .crypto-chart {
      width: 100%; height: 60px; display: block;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px; margin-bottom: 8px;
    }
    .crypto-actions {
      display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    }
    .crypto-input {
      width: 60px; flex-shrink: 0; padding: 8px 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px; color: #fff; font-size: 14px; outline: none;
      -moz-appearance: textfield;
    }
    .crypto-input::-webkit-outer-spin-button,
    .crypto-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .crypto-input:focus { border-color: #f5a623; }
    .crypto-btn {
      flex: 1; min-width: 0; padding: 8px 8px; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .crypto-btn.buy { background: #4caf50; color: #fff; }
    .crypto-btn.sell { background: #ff5252; color: #fff; }
    .crypto-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .crypto-holdings {
      font-size: 11px; color: #888; margin-top: 6px;
    }
    .crypto-holdings span { color: #f5a623; font-weight: 600; }

    /* ===== Нижня навігація ===== */
    .bottom-nav {
      display: flex; justify-content: space-around;
      padding: 10px 0 14px; background: rgba(0, 0, 0, 0.5);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      position: relative; z-index: 5;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 4px; color: #666; font-size: 10px;
      cursor: pointer; transition: color 0.2s; flex: 1;
    }
    .nav-item.active { color: #f5a623; }
    .nav-icon { font-size: 22px; }

    #status {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9); padding: 10px 20px; border-radius: 10px;
      font-size: 13px; opacity: 0; transition: opacity 0.3s;
      pointer-events: none; white-space: nowrap; z-index: 100;
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
    }
    #status.show { opacity: 1; }
  </style>
</head>
<body>

  <!-- ===== АВТОРИЗАЦІЯ ===== -->
  <div id="auth-screen">
    <div class="auth-logo">🐹</div>
    <div class="auth-title">Hamka Kombat</div>
    <div class="auth-subtitle">Увійдіть, щоб грати та зберігати прогрес</div>
    <div class="auth-form">
      <input type="email" id="auth-email" class="auth-input" placeholder="Email" autocomplete="email">
      <input type="password" id="auth-password" class="auth-input" placeholder="Пароль (мін. 6 символів)" autocomplete="current-password">
      <div class="auth-error" id="auth-error"></div>
      <button class="auth-btn primary" id="auth-submit">Увійти</button>
      <div class="auth-hint" id="auth-hint"></div>
      <div class="auth-divider">або</div>
      <button class="auth-btn telegram" id="tg-login-btn">
        <span>✈️</span> Увійти через Telegram
      </button>
    </div>
    <div class="auth-switch">
      <span id="auth-switch-text">Немає акаунту?</span>
      <a id="auth-switch-link">Зареєструватися</a>
    </div>
  </div>

  <!-- ===== ГРА ===== -->
  <div id="game-screen">
    <div class="top-bar">
      <div class="user-info">
        <div class="avatar" id="avatar">H</div>
        <div>
          <div class="user-name" id="user-name">Гравець</div>
          <div class="user-level" id="user-level">Bronze</div>
        </div>
      </div>
      <button class="logout-btn" id="logout-btn">Вийти</button>
    </div>

    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-label">Монети</div>
        <div class="stat-value coin" id="coin-display">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Енергія</div>
        <div class="stat-value energy" id="energy-display">200/200</div>
      </div>
    </div>

    <!-- ТАП -->
    <div class="page active" id="page-tap">
      <div class="tap-area" id="tap-area">
        <div class="hamster-wrap">
          <div class="hamster" id="hamster">🐹</div>
        </div>
        <div class="tap-hint">Натискай на хом'яка 🐹</div>
      </div>
    </div>

    <!-- КРИПТА -->
    <div class="page crypto-page" id="page-crypto">
      <div class="crypto-title">💹 Ринок крипти</div>
      <div id="crypto-list"></div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item active" data-page="tap"><span class="nav-icon">🐹</span><span>Грати</span></div>
      <div class="nav-item" data-page="crypto"><span class="nav-icon">💹</span><span>Крипта</span></div>
    </div>
  </div>

  <div id="status"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get, set, update, runTransaction, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD1-UDrqRzfUw_32nOzqT2mAozzab5DJZk",
      authDomain: "hamka-game.firebaseapp.com",
      databaseURL: "https://hamka-game-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "hamka-game",
      storageBucket: "hamka-game.firebasestorage.app",
      messagingSenderId: "975050013138",
      appId: "1:975050013138:web:19f42c1c5f2b2d35d6300b",
      measurementId: "G-W4G3ZZ5R68"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const tg = window.Telegram.WebApp;
    try { tg.expand(); tg.ready(); } catch(e) {}

    // === DOM ===
    const authScreen = document.getElementById('auth-screen');
    const gameScreen = document.getElementById('game-screen');
    const authEmail = document.getElementById('auth-email');
    const authPassword = document.getElementById('auth-password');
    const authError = document.getElementById('auth-error');
    const authHint = document.getElementById('auth-hint');
    const authSubmit = document.getElementById('auth-submit');
    const authSwitchText = document.getElementById('auth-switch-text');
    const authSwitchLink = document.getElementById('auth-switch-link');
    const tgLoginBtn = document.getElementById('tg-login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const coinDisplay = document.getElementById('coin-display');
    const energyDisplay = document.getElementById('energy-display');
    const hamster = document.getElementById('hamster');
    const tapArea = document.getElementById('tap-area');
    const statusEl = document.getElementById('status');
    const userNameEl = document.getElementById('user-name');
    const avatarEl = document.getElementById('avatar');
    const userLevelEl = document.getElementById('user-level');
    const cryptoListEl = document.getElementById('crypto-list');

    // === Стан ===
    let isLoginMode = true;
    let state = { coins: 0, energy: 200, maxEnergy: 200, holdings: {} };
    let pendingTap = false;
    let unsubscribeUserData = null;
    let energyInterval = null;
    let cryptoInterval = null;
    let currentUid = null;

    const COINS = ['OLDHAM', 'NEWHAM', 'HAM', 'BHAM', 'PLAYERHOM'];
    const INITIAL_PRICES = {
      OLDHAM: 100, NEWHAM: 250, HAM: 500, BHAM: 1000, PLAYERHOM: 50
    };
    const PLAYERHOM_BASE = 50;
    const PLAYERHOM_PER_UNIT = 2; // кожна одиниця холдингів у грі додає +2 до ціни

    // === Збереження qty в localStorage ===
    function getQty(symbol) {
      const v = localStorage.getItem('qty_' + symbol);
      return v ? Math.max(1, parseInt(v) || 1) : 1;
    }
    function setQty(symbol, val) {
      localStorage.setItem('qty_' + symbol, val);
    }

    function showStatus(text) {
      statusEl.innerText = text;
      statusEl.classList.add('show');
      clearTimeout(showStatus._t);
      showStatus._t = setTimeout(() => statusEl.classList.remove('show'), 2000);
    }

    function formatNumber(num) {
      if (num >= 1e9) return (num / 1e9).toFixed(1) + 'B';
      if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
      if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
      return Math.floor(num).toString();
    }

    function formatPrice(p) {
      if (p >= 1e6) return (p / 1e6).toFixed(2) + 'M';
      if (p >= 1e3) return (p / 1e3).toFixed(2) + 'K';
      return p.toFixed(2);
    }

    function getTelegramNick(tgUser) {
      if (!tgUser) return null;
      if (tgUser.username) return '@' + tgUser.username;
      if (tgUser.first_name) return tgUser.first_name;
      return 'Гравець';
    }

    function getAuthErrorMessage(err) {
      const messages = {
        'auth/invalid-email': 'Невірний формат email',
        'auth/user-not-found': 'Користувача не знайдено. Зареєструйтесь.',
        'auth/wrong-password': 'Невірний пароль',
        'auth/email-already-in-use': 'Цей email вже зареєстровано. Увійдіть.',
        'auth/weak-password': 'Пароль занадто слабкий (мін. 6 символів)',
        'auth/invalid-credential': 'Невірний email або пароль',
        'auth/too-many-requests': 'Занадто багато спроб. Зачекайте.',
        'auth/network-request-failed': 'Мережева помилка. Перевірте інтернет.',
        'auth/operation-not-allowed': 'Email/Password не увімкнено у Firebase Console',
        'auth/unauthorized-domain': 'Домен не авторизований у Firebase Console',
        'auth/internal-error': 'Внутрішня помилка Firebase. Спробуйте ще раз.'
      };
      return messages[err.code] || err.message || 'Невідома помилка';
    }

    async function authWithRetry(action, email, password, maxRetries = 2) {
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
          if (action === 'login') return await signInWithEmailAndPassword(auth, email, password);
          else return await createUserWithEmailAndPassword(auth, email, password);
        } catch (err) {
          if (err.code === 'auth/network-request-failed' && attempt < maxRetries) {
            authError.innerText = `Мережева помилка. Спроба ${attempt + 1}/${maxRetries}...`;
            await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
            continue;
          }
          throw err;
        }
      }
    }

    function switchAuthMode() {
      isLoginMode = !isLoginMode;
      authSubmit.innerText = isLoginMode ? 'Увійти' : 'Зареєструватися';
      authSwitchText.innerText = isLoginMode ? 'Немає акаунту?' : 'Вже є акаунт?';
      authSwitchLink.innerText = isLoginMode ? 'Зареєструватися' : 'Увійти';
      authError.innerText = '';
      authHint.innerText = '';
    }
    authSwitchLink.addEventListener('click', switchAuthMode);

    authSubmit.addEventListener('click', async () => {
      const email = authEmail.value.trim();
      const password = authPassword.value;
      if (!email || !password) { authError.innerText = 'Заповніть email та пароль'; return; }
      if (!email.includes('@')) { authError.innerText = 'Введіть коректний email'; return; }
      if (password.length < 6) { authError.innerText = 'Пароль має бути мінімум 6 символів'; return; }

      authSubmit.disabled = true;
      authError.innerText = '';
      authHint.innerText = '';
      try {
        await authWithRetry(isLoginMode ? 'login' : 'register', email, password);
      } catch (err) {
        authError.innerText = getAuthErrorMessage(err);
        if (err.code === 'auth/unauthorized-domain') {
          authHint.innerText = 'Додайте домен у Firebase Console → Authentication → Settings → Authorized domains';
        } else if (err.code === 'auth/operation-not-allowed') {
          authHint.innerText = 'Увімкніть Email/Password у Firebase Console';
        }
      } finally {
        authSubmit.disabled = false;
      }
    });

    tgLoginBtn.addEventListener('click', async () => {
      const tgUser = tg.initDataUnsafe?.user;
      if (!tgUser) {
        authError.innerText = 'Не вдалося отримати дані Telegram';
        authHint.innerText = 'Відкрийте гру через Telegram-бота';
        return;
      }
      const fakeEmail = `tg_${tgUser.id}@hamka.test`;
      const fakePassword = `tg_${tgUser.id}_secret_hamka`;
      const nick = getTelegramNick(tgUser);

      tgLoginBtn.disabled = true;
      authError.innerText = '';
      authHint.innerText = '';
      try {
        try {
          await signInWithEmailAndPassword(auth, fakeEmail, fakePassword);
        } catch (e) {
          if (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') {
            await createUserWithEmailAndPassword(auth, fakeEmail, fakePassword);
          } else {
            throw e;
          }
        }
        showStatus(`✅ Вітаємо, ${nick}!`);
      } catch (err) {
        authError.innerText = getAuthErrorMessage(err);
      } finally {
        tgLoginBtn.disabled = false;
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUid = user.uid;
        authScreen.classList.add('hidden');
        gameScreen.classList.add('visible');

        const tgUser = tg.initDataUnsafe?.user;
        let displayName = tgUser ? getTelegramNick(tgUser) : (user.email?.split('@')[0] || 'Гравець');
        userNameEl.innerText = displayName;
        avatarEl.innerText = displayName.replace('@', '').charAt(0).toUpperCase();

        initGame(user.uid);
        initCryptoSystem();
      } else {
        currentUid = null;
        authScreen.classList.remove('hidden');
        gameScreen.classList.remove('visible');
        if (unsubscribeUserData) { unsubscribeUserData(); unsubscribeUserData = null; }
        if (energyInterval) { clearInterval(energyInterval); energyInterval = null; }
        if (cryptoInterval) { clearInterval(cryptoInterval); cryptoInterval = null; }
      }
    });

    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        item.classList.add('active');
        document.getElementById('page-' + item.dataset.page).classList.add('active');
      });
    });

    // ============================================================
    // ТАП
    // ============================================================
    function initGame(uid) {
      const userRef = ref(db, 'users/' + uid);
      const energyRef = ref(db, 'users/' + uid + '/energy');

      get(userRef).then((snap) => {
        if (!snap.exists()) {
          set(userRef, {
            coins: 0, energy: 200, maxEnergy: 200,
            holdings: {}, createdAt: Date.now()
          });
        } else if (!snap.val().holdings) {
          update(userRef, { holdings: {} });
        }
      }).catch(err => console.error("Init user error:", err));

      unsubscribeUserData = onValue(userRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        if (pendingTap) return;

        state.coins = data.coins || 0;
        state.energy = data.energy ?? 200;
        state.maxEnergy = data.maxEnergy ?? 200;
        state.holdings = data.holdings || {};

        renderUI();
        // Перемальовуємо список, але зберігаємо qty
        renderCryptoList();
      });

      hamster.onclick = async (e) => {
        if (state.energy < 1) { showStatus("❌ Немає енергії!"); return; }

        state.energy = Math.max(0, state.energy - 1);
        state.coins = state.coins + 1;
        renderUI();

        const rect = tapArea.getBoundingClientRect();
        const effect = document.createElement('div');
        effect.className = 'tap-effect';
        effect.innerText = '+1';
        effect.style.left = (e.clientX - rect.left - 10) + 'px';
        effect.style.top = (e.clientY - rect.top - 10) + 'px';
        tapArea.appendChild(effect);
        setTimeout(() => effect.remove(), 800);

        try { tg.HapticFeedback.impactOccurred('light'); } catch(e) {}

        pendingTap = true;
        try {
          await runTransaction(userRef, (data) => {
            if (!data) data = { coins: 0, energy: 200, maxEnergy: 200, holdings: {} };
            const curEnergy = data.energy ?? 200;
            if (curEnergy < 1) return;
            data.energy = curEnergy - 1;
            data.coins = (data.coins || 0) + 1;
            return data;
          });
        } catch (err) {
          console.error("Tap error:", err);
        } finally {
          pendingTap = false;
        }
      };

      if (energyInterval) clearInterval(energyInterval);
      energyInterval = setInterval(async () => {
        if (state.energy >= state.maxEnergy) return;
        try {
          await runTransaction(energyRef, (c) => {
            const cur = c ?? 200;
            return Math.min(state.maxEnergy, cur + 5);
          });
        } catch (err) {}
      }, 3000);
    }

    function renderUI() {
      coinDisplay.innerText = formatNumber(state.coins);
      energyDisplay.innerText = Math.floor(state.energy) + "/" + state.maxEnergy;
      const level = state.coins >= 1e9 ? "Creator" :
                    state.coins >= 1e8 ? "Legendary" :
                    state.coins >= 1e7 ? "Master" :
                    state.coins >= 1e6 ? "Gold" :
                    state.coins >= 1e5 ? "Silver" : "Bronze";
      userLevelEl.innerText = level;
    }

    // ============================================================
    // КРИПТО
    // ============================================================
    let cryptoState = {};

    async function initCryptoSystem() {
      for (const symbol of COINS) {
        const cRef = ref(db, 'crypto/' + symbol);
        const snap = await get(cRef);
        if (!snap.exists()) {
          const price = INITIAL_PRICES[symbol];
          await set(cRef, {
            price: price,
            history: [{ t: Date.now(), p: price }]
          });
        }
      }

      const cryptoRef = ref(db, 'crypto');
      onValue(cryptoRef, (snap) => {
        const data = snap.val();
        if (!data) return;
        cryptoState = data;
        renderCryptoList();
      });

      if (cryptoInterval) clearInterval(cryptoInterval);
      cryptoInterval = setInterval(async () => {
        for (const symbol of COINS) {
          if (symbol === 'PLAYERHOM') continue; // PLAYERHOM не рухається сам
          updateCryptoPrice(symbol);
        }
      }, 10000);
    }

    async function updateCryptoPrice(symbol) {
      const cRef = ref(db, 'crypto/' + symbol);
      try {
        await runTransaction(cRef, (data) => {
          if (!data) return data;
          const currentPrice = data.price || INITIAL_PRICES[symbol];
          const isGrowth = Math.random() < 0.4;
          const percent = (Math.random() * 0.03) + 0.005;
          let newPrice = isGrowth
            ? currentPrice * (1 + percent)
            : currentPrice * (1 - percent);
          newPrice = Math.max(1, newPrice);

          const history = data.history || [];
          history.push({ t: Date.now(), p: newPrice });
          if (history.length > 30) history.shift();

          return { price: newPrice, history: history };
        });
      } catch (err) {
        console.error("Crypto update error:", err);
      }
    }

    // === PLAYERHOM: ціна = базова + (сумарні холдинги всіх гравців * коефіцієнт) ===
    async function recalcPlayerhomPrice() {
      try {
        // Отримуємо всіх користувачів
        const usersSnap = await get(ref(db, 'users'));
        const users = usersSnap.val() || {};
        let totalHoldings = 0;
        for (const uid in users) {
          const h = users[uid]?.holdings?.PLAYERHOM || 0;
          totalHoldings += h;
        }

        const newPrice = PLAYERHOM_BASE + totalHoldings * PLAYERHOM_PER_UNIT;
        const playerRef = ref(db, 'crypto/PLAYERHOM');

        await runTransaction(playerRef, (data) => {
          const history = data?.history || [];
          history.push({ t: Date.now(), p: newPrice });
          if (history.length > 30) history.shift();
          return { price: newPrice, history: history };
        });
      } catch (err) {
        console.error("recalcPlayerhom error:", err);
      }
    }

    function renderCryptoList() {
      if (!cryptoListEl) return;
      // Зберігаємо поточні qty з полів (щоб не втратити при ререндері)
      document.querySelectorAll('.crypto-input').forEach(inp => {
        const symbol = inp.dataset.symbol;
        if (symbol) setQty(symbol, inp.value);
      });

      cryptoListEl.innerHTML = '';

      for (const symbol of COINS) {
        const info = cryptoState[symbol];
        if (!info) continue;

        const price = info.price || INITIAL_PRICES[symbol];
        const history = info.history || [];
        const firstPrice = history[0]?.p || price;
        const isUp = price >= firstPrice;

        const holding = state.holdings?.[symbol] || 0;
        const holdingValue = holding * price;
        const qty = getQty(symbol);

        const card = document.createElement('div');
        card.className = 'crypto-card';
        card.innerHTML = `
          <div class="crypto-header">
            <div class="crypto-symbol">${symbol}</div>
            <div class="crypto-price ${isUp ? 'up' : 'down'}">${formatPrice(price)} 🪙</div>
          </div>
          <canvas class="crypto-chart" id="chart-${symbol}" width="300" height="60"></canvas>
          <div class="crypto-actions">
            <input type="number" min="1" value="${qty}" class="crypto-input" id="qty-${symbol}" data-symbol="${symbol}">
            <button class="crypto-btn buy" data-symbol="${symbol}" data-action="buy">Купити</button>
            <button class="crypto-btn sell" data-symbol="${symbol}" data-action="sell">Продати</button>
          </div>
          <div class="crypto-holdings">У вас: <span>${holding}</span> ${symbol} (≈ ${formatPrice(holdingValue)} 🪙)</div>
        `;
        cryptoListEl.appendChild(card);

        drawChart(document.getElementById('chart-' + symbol), history, isUp);
      }

      // Обробники
      cryptoListEl.querySelectorAll('.crypto-input').forEach(inp => {
        inp.addEventListener('input', () => {
          const symbol = inp.dataset.symbol;
          if (symbol) setQty(symbol, inp.value);
        });
      });

      cryptoListEl.querySelectorAll('.crypto-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const symbol = btn.dataset.symbol;
          const action = btn.dataset.action;
          const qtyInput = document.getElementById('qty-' + symbol);
          const qty = parseInt(qtyInput.value) || 0;
          if (qty <= 0) { showStatus("❌ Введіть кількість"); return; }
          setQty(symbol, qty);
          tradeCrypto(symbol, action, qty);
        });
      });
    }

    function drawChart(canvas, history, isUp) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      if (history.length < 2) return;

      const prices = history.map(x => x.p);
      const min = Math.min(...prices);
      const max = Math.max(...prices);
      const range = max - min || 1;

      ctx.beginPath();
      ctx.strokeStyle = isUp ? '#4caf50' : '#ff5252';
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';

      history.forEach((point, i) => {
        const x = (i / (history.length - 1)) * (w - 4) + 2;
        const y = h - ((point.p - min) / range) * (h - 8) - 4;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      ctx.lineTo(w - 2, h);
      ctx.lineTo(2, h);
      ctx.closePath();
      ctx.fillStyle = isUp ? 'rgba(76, 175, 80, 0.15)' : 'rgba(255, 82, 82, 0.15)';
      ctx.fill();
    }

    // === Купівля/Продаж ===
    async function tradeCrypto(symbol, action, qty) {
      if (!currentUid) return;
      const info = cryptoState[symbol];
      if (!info) return;

      const price = info.price;
      const total = price * qty;
      const userRef = ref(db, 'users/' + currentUid);

      try {
        let success = false;
        let errorMsg = '';

        await runTransaction(userRef, (data) => {
          if (!data) return data;
          if (!data.holdings) data.holdings = {};

          if (action === 'buy') {
            if ((data.coins || 0) < total) {
              errorMsg = 'Недостатньо монет';
              return;
            }
            data.coins = (data.coins || 0) - total;
            data.holdings[symbol] = (data.holdings[symbol] || 0) + qty;
            success = true;
          } else {
            const owned = data.holdings[symbol] || 0;
            if (owned < qty) {
              errorMsg = `У вас лише ${owned} ${symbol}`;
              return;
            }
            data.coins = (data.coins || 0) + total;
            data.holdings[symbol] = owned - qty;
            success = true;
          }
          return data;
        });

        if (!success) {
          showStatus("❌ " + (errorMsg || "Помилка"));
          return;
        }

        // Оновлюємо ціну PLAYERHOM на основі загальних холдингів
        // (купив 3 → продав 3 → холдинги повернулись → ціна повернулась)
        if (symbol === 'PLAYERHOM' || true) {
          await recalcPlayerhomPrice();
        }

        showStatus(action === 'buy'
          ? `✅ Куплено ${qty} ${symbol} за ${formatPrice(total)} 🪙`
          : `✅ Продано ${qty} ${symbol} за ${formatPrice(total)} 🪙`);

        try { tg.HapticFeedback.notificationOccurred('success'); } catch(e) {}
      } catch (err) {
        console.error("Trade error:", err);
        showStatus("❌ Помилка транзакції");
      }
    }

    logoutBtn.addEventListener('click', () => {
      if (energyInterval) { clearInterval(energyInterval); energyInterval = null; }
      if (cryptoInterval) { clearInterval(cryptoInterval); cryptoInterval = null; }
      signOut(auth);
    });

  </script>
