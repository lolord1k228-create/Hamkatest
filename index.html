<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🎮 Hamka — Мультигра</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js">
    </script>
    <style>
        :root {
            --primary: #00ff88;
            --bg: #07070b;
            --bg-card: #12121a;
            --border: #1e1e2e;
            --text: #e8e8f0;
            --text-secondary: #8888aa;
            --gold: #fbbf24;
            --crypto: #f472b6;
            --crypto2: #fbbf24;
            --radius: 12px;
            --game1: #00ff88;
            --game2: #ff6b6b;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: manipulation;
        }
        .app {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #authScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 30px 24px;
            background: radial-gradient(ellipse at center, #0a0a1a, #07070b);
            overflow-y: auto;
        }
        #authScreen .logo {
            font-size: 60px;
            margin-bottom: 4px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 40px rgba(0, 255, 136, 0.2));
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0px)
            }
            50% {
                transform: translateY(-6px)
            }
        }
        #authScreen h2 {
            color: var(--primary);
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 2px;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.15);
        }
        #authScreen .subtitle {
            color: var(--text-secondary);
            font-size: 11px;
            margin-bottom: 12px;
        }
        #authScreen .auth-tabs {
            display: flex;
            gap: 4px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 8px;
        }
        #authScreen .auth-tab {
            flex: 1;
            padding: 8px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        #authScreen .auth-tab.active {
            border-color: var(--primary);
            color: var(--text);
            background: rgba(0, 255, 136, 0.08);
        }
        #authScreen .auth-tab:active {
            transform: scale(0.95);
        }
        #authScreen input {
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: var(--radius);
            width: 100%;
            max-width: 300px;
            margin-bottom: 6px;
            text-align: center;
            font-size: 13px;
            outline: none;
            transition: border 0.3s;
        }
        #authScreen input:focus {
            border-color: var(--primary);
        }
        #authScreen input::placeholder {
            color: #555;
        }
        #authScreen .btn {
            width: 100%;
            max-width: 300px;
            padding: 10px;
            margin-top: 3px;
            font-size: 13px;
            font-weight: 700;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: transform 0.2s;
        }
        #authScreen .btn:active {
            transform: scale(0.97);
        }
        #authScreen .btn-g {
            background: linear-gradient(135deg, var(--primary), #00cc66);
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
        }
        #authScreen .btn-tg {
            background: linear-gradient(135deg, #229ED9, #1a7ab5);
            color: #fff;
        }
        #authScreen .btn-p {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: #fff;
        }
        #authScreen .btn-o {
            background: #f97316;
            color: #fff;
        }
        #authScreen .divider {
            color: #555;
            font-size: 9px;
            margin: 6px 0 3px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 300px;
        }
        #authScreen .divider::before,
        #authScreen .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        #authScreen .error {
            color: #ef4444;
            font-size: 10px;
            margin-top: 3px;
            min-height: 16px;
            text-align: center;
        }
        #authScreen .success {
            color: var(--primary);
            font-size: 10px;
            margin-top: 3px;
            min-height: 16px;
            text-align: center;
        }
        #authScreen .game-selector {
            display: flex;
            gap: 8px;
            margin: 8px 0;
            width: 100%;
            max-width: 300px;
        }
        #authScreen .game-selector .game-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-card);
            color: var(--text);
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        #authScreen .game-selector .game-btn .icon {
            font-size: 24px;
            display: block;
        }
        #authScreen .game-selector .game-btn.active {
            border-color: var(--primary);
            background: rgba(0, 255, 136, 0.08);
        }
        #authScreen .game-selector .game-btn.game1.active {
            border-color: var(--game1);
            background: rgba(0, 255, 136, 0.08);
        }
        #authScreen .game-selector .game-btn.game2.active {
            border-color: var(--game2);
            background: rgba(255, 107, 107, 0.08);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 6px;
            background: rgba(18, 18, 26, 0.95);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 1px;
        }
        .top-bar .stat {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 6px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 2px 4px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }
        .top-bar .stat .val {
            color: var(--text);
            font-size: 7px;
            font-weight: 700;
        }
        .top-bar .stat .gold {
            color: var(--gold);
        }
        .top-bar .stat .crypto {
            color: var(--crypto);
        }
        .top-bar .stat .crypto2 {
            color: var(--crypto2);
        }
        .top-bar .stat .game1-color {
            color: var(--game1);
        }
        .top-bar .stat .game2-color {
            color: var(--game2);
        }

        .game-tabs {
            display: flex;
            gap: 2px;
            padding: 3px 4px;
            background: rgba(18, 18, 26, 0.95);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .game-tabs button {
            flex: 1;
            padding: 4px 2px;
            border: none;
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-secondary);
            font-size: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .game-tabs button::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s;
        }
        .game-tabs button.active {
            color: var(--text);
            background: rgba(0, 255, 136, 0.08);
        }
        .game-tabs button.active::after {
            width: 60%;
        }
        .game-tabs button .tab-icon {
            font-size: 14px;
            display: block;
        }
        .game-tabs button .tab-label {
            font-size: 4px;
            display: block;
            margin-top: 1px;
        }
        .game-tabs button.game1-tab.active {
            color: var(--game1);
            background: rgba(0, 255, 136, 0.08);
        }
        .game-tabs button.game1-tab.active::after {
            background: var(--game1);
        }
        .game-tabs button.game2-tab.active {
            color: var(--game2);
            background: rgba(255, 107, 107, 0.08);
        }
        .game-tabs button.game2-tab.active::after {
            background: var(--game2);
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 4px 6px;
            -webkit-overflow-scrolling: touch;
        }
        .content-area::-webkit-scrollbar {
            width: 3px;
        }
        .content-area::-webkit-scrollbar-track {
            background: var(--bg);
        }
        .content-area::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        .page {
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        .page.show {
            display: block;
        }
        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(6px)
            }
            100% {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .center-game {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70px;
            gap: 3px;
            padding: 3px 0;
        }

        .tap-circle {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2a2a3a, #12121a);
            border: 5px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 100px;
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.3), inset 0 0 40px rgba(0, 255, 136, 0.08);
            transition: transform 0.08s linear;
            touch-action: manipulation;
            position: relative;
            overflow: hidden;
        }
        .tap-circle:active {
            transform: scale(0.92);
            box-shadow: 0 0 100px rgba(0, 255, 136, 0.5);
        }
        .tap-circle .tap-ripple {
            position: absolute;
            border-radius: 50%;
            border: 3px solid var(--primary);
            animation: ripple 0.7s ease-out forwards;
            pointer-events: none;
        }
        @keyframes ripple {
            0% {
                width: 0;
                height: 0;
                opacity: 1
            }
            100% {
                width: 280px;
                height: 280px;
                opacity: 0
            }
        }
        .tap-circle .tap-emoji {
            font-size: 100px;
            z-index: 1;
        }
        .tap-balance {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .tap-balance.gold {
            color: var(--gold);
        }
        .tap-balance.game1 {
            color: var(--game1);
        }
        .tap-balance.game2 {
            color: var(--game2);
        }

        @media (max-width:400px) {
            .tap-circle {
                width: 200px;
                height: 200px;
                font-size: 80px;
            }
            .tap-circle .tap-emoji {
                font-size: 80px;
            }
            .tap-balance {
                font-size: 14px;
            }
        }
        @media (min-width:600px) {
            .tap-circle {
                width: 300px;
                height: 300px;
                font-size: 120px;
            }
            .tap-circle .tap-emoji {
                font-size: 120px;
            }
        }

        .bar-wrap {
            width: 92%;
            margin: 2px auto;
        }
        .energy-bar,
        .xp-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }
        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #fbbf24, #f97316);
            transition: width 0.4s;
        }
        .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #06b6d4);
            transition: width 0.4s;
        }
        .bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 4px;
            color: var(--text-secondary);
            margin-top: 1px;
        }

        .bal {
            text-align: center;
            padding: 2px;
            font-size: 12px;
            font-weight: 800;
            color: var(--gold);
        }

        .stats-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2px;
            padding: 2px 0;
            font-size: 5px;
            color: var(--text-secondary);
        }
        .stats-row .stat-item {
            display: flex;
            align-items: center;
            gap: 2px;
            background: rgba(255, 255, 255, 0.03);
            padding: 1px 4px;
            border-radius: 10px;
        }
        .stats-row .stat-item .highlight {
            color: var(--primary);
        }

        .btn {
            padding: 3px 8px;
            border: none;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 6px;
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-g {
            background: linear-gradient(135deg, var(--primary), #00cc66);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.15);
        }
        .btn-o {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: #fff;
        }
        .btn-r {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
        }
        .btn-b {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
        }
        .btn-p {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: #fff;
        }
        .btn-gold {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
        }
        .btn-sm {
            padding: 2px 5px;
            font-size: 5px;
        }
        .btn-lg {
            padding: 5px 10px;
            font-size: 8px;
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .card {
            background: var(--bg-card);
            padding: 4px 6px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 3px;
        }
        .card .flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 3px;
            flex-wrap: wrap;
        }
        .card-title {
            font-size: 7px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .toast {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 7px;
            font-weight: 600;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
            border: 1px solid var(--primary);
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .floating-number {
            position: fixed;
            font-size: 20px;
            font-weight: 800;
            pointer-events: none;
            z-index: 1000;
            background: linear-gradient(135deg, var(--gold), #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.8)
            }
            30% {
                transform: translateY(-25px) scale(1.2)
            }
            100% {
                opacity: 0;
                transform: translateY(-50px) scale(0.6)
            }
        }

        .profile-header {
            text-align: center;
            padding: 3px;
        }
        .profile-header .avatar {
            font-size: 32px;
        }
        .profile-header .name {
            font-size: 12px;
            font-weight: 700;
            margin-top: 2px;
        }
        .profile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 2px;
            margin-top: 3px;
        }
        .profile-stat {
            background: rgba(255, 255, 255, 0.03);
            padding: 2px;
            border-radius: var(--radius);
            text-align: center;
            font-size: 4px;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .profile-stat .value {
            font-size: 8px;
            font-weight: 800;
            color: var(--gold);
        }
        .profile-stat .value.game1 {
            color: var(--game1);
        }
        .profile-stat .value.game2 {
            color: var(--game2);
        }

        .shop-tabs {
            display: flex;
            gap: 2px;
            margin-bottom: 2px;
            flex-wrap: wrap;
        }
        .shop-tab {
            flex: 1;
            min-width: 28px;
            padding: 2px 3px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-secondary);
            font-size: 5px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        .shop-tab.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        .inventory-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            margin: 2px 0;
        }
        .inv-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius);
            padding: 2px 4px;
            text-align: center;
            min-width: 28px;
            border: 1px solid var(--border);
        }
        .inv-item .icon {
            font-size: 12px;
            display: block;
        }
        .inv-item .count {
            font-size: 4px;
            color: var(--gold);
        }

        .chest-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: fadeIn 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .chest-modal.show {
            display: flex;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        .chest-modal .modal-content {
            background: var(--bg-card);
            border: 2px solid var(--gold);
            border-radius: var(--radius);
            padding: 16px;
            max-width: 300px;
            width: 90%;
            text-align: center;
            animation: modalPop 0.4s ease;
        }
        @keyframes modalPop {
            0% {
                transform: scale(0.7);
                opacity: 0;
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .chest-modal .chest-icon {
            font-size: 60px;
            margin-bottom: 6px;
            animation: chestShake 0.5s ease;
        }
        @keyframes chestShake {
            0% {
                transform: rotate(0deg) scale(1);
            }
            25% {
                transform: rotate(-12deg) scale(1.1);
            }
            50% {
                transform: rotate(12deg) scale(1.1);
            }
            75% {
                transform: rotate(-8deg) scale(1.05);
            }
            100% {
                transform: rotate(0deg) scale(1);
            }
        }
        .chest-modal .reward-text {
            font-size: 16px;
            font-weight: 800;
            color: var(--gold);
            margin: 6px 0;
        }
        .chest-modal .reward-desc {
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .chest-modal .close-btn {
            padding: 6px 20px;
            font-size: 10px;
            font-weight: 700;
            border: none;
            border-radius: var(--radius);
            background: linear-gradient(135deg, var(--primary), #00cc66);
            color: #000;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .chest-modal .close-btn:active {
            transform: scale(0.95);
        }

        .promo-row {
            display: flex;
            gap: 2px;
            padding: 2px 4px;
            background: rgba(18, 18, 26, 0.95);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .promo-row input {
            flex: 1;
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 2px 4px;
            border-radius: var(--radius);
            font-size: 5px;
            outline: none;
        }
        .promo-row .promo-btn {
            display: block;
        }

        .game-selector-home {
            display: flex;
            gap: 8px;
            margin: 4px 0;
            width: 100%;
        }
        .game-selector-home .game-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-card);
            color: var(--text);
            font-size: 8px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        .game-selector-home .game-btn .icon {
            font-size: 20px;
            display: block;
        }
        .game-selector-home .game-btn.game1-btn {
            border-color: var(--game1);
        }
        .game-selector-home .game-btn.game1-btn:hover {

        // ============================================================
        //  🔧 ДОПОМІЖНІ ФУНКЦІЇ
        // ============================================================
        function rand(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

        function toast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => el.classList.remove('show'), 2500);
        }

        function formatNum(n) {
            if (n < 1000) return Math.floor(n).toString();
            if (n < 1e6) return (n / 1e3).toFixed(1) + 'K';
            if (n < 1e9) return (n / 1e6).toFixed(1) + 'M';
            if (n < 1e12) return (n / 1e9).toFixed(1) + 'B';
            return (n / 1e12).toFixed(1) + 'T';
        }

        // ============================================================
        //  📊 РІВНІ (спільні для обох ігор)
        // ============================================================
        const LEVEL_NAMES = {
            1: '🌱 Новачок',
            2: '🚀 Початок',
            3: '🥉 Бронза',
            4: '🥈 Срібло',
            5: '🥇 Золото',
            6: '💎 Алмаз',
            7: '🟢 Смарагд',
            8: '🔴 Рубін 1',
            9: '🔴 Рубін 2',
            10: '🔴 Рубін 3',
            11: '👑 Майстер 1',
            12: '👑 Майстер 2',
            13: '👑 Майстер 3',
            14: '👑 Майстер 4',
            15: '👑 Майстер 5',
            16: '👑 Майстер 6',
            17: '👑 Майстер 7',
            18: '👑 Майстер 8',
            19: '👑 Майстер 9',
            20: '👑 Майстер 10'
        };

        function getLevelName(level) { return LEVEL_NAMES[level] || `⭐ Рівень ${level}`; }

        const LEVELS = [];
        let xp = 0;
        for (let l = 1; l <= 20; l++) {
            if (l === 1) xp = 0;
            else if (l <= 10) xp = Math.floor(200 * Math.pow(1.8, l - 1));
            else xp = Math.floor(100000 * Math.pow(1.5, l - 10));
            LEVELS.push({ l: l, x: xp, rw: Math.floor(xp * 0.05) + 100 });
        }

        function getLevelReward(l) {
            for (let i = 0; i < LEVELS.length; i++) {
                if (LEVELS[i].l === l) return LEVELS[i].rw;
            }
            return 0;
        }

        function getLevelXp(l) {
            for (let i = 0; i < LEVELS.length; i++) {
                if (LEVELS[i].l === l) return LEVELS[i].x;
            }
            return 0;
        }

        function checkLevelUp(game) {
            let g = game === 1 ? G.game1 : G.game2;
            let lvl = 1;
            for (let i = LEVELS.length - 1; i >= 0; i--) {
                if (g.xp >= LEVELS[i].x) { lvl = LEVELS[i].l; break; }
            }
            if (lvl > g.level) {
                let reward = 0;
                for (let i = g.level + 1; i <= lvl; i++) { reward += getLevelReward(i); }
                g.coins += reward;
                toast(`🎉 Новий рівень: ${getLevelName(lvl)}! +${reward}💰`);
                g.level = lvl;
            } else {
                g.level = lvl;
            }
        }

        function addXP(game, amount) {
            let g = game === 1 ? G.game1 : G.game2;
            g.xp += amount;
            checkLevelUp(game);
            updateUI();
        }

        // ============================================================
        //  🎮 ГРА 1: Крипто-клікер
        // ============================================================
        function calcTapIncome1() {
            let g = G.game1;
            let base = g.tapLevel + g.upgrades.tapLevel;
            let powerMul = 1 + g.upgrades.tapPower * 0.5;
            let boost = g.coinBoost * (1 + g.upgrades.coinBoost * 0.5);
            let inc = (rand(1, 5) + base) * boost * powerMul;
            let critChance = g.crit + g.upgrades.critChance * 0.05;
            if (Math.random() < critChance) {
                inc *= 2;
                toast('💥 КРИТ! x2');
            }
            return Math.floor(inc);
        }

        function getLuckBonus1() {
            return Math.min(G.game1.luck - 1, 0.3);
        }

        function calcMaxEnergy1() {
            let g = G.game1;
            return 100 + g.upgrades.maxEnergy * 50 + g.upgrades.energyUp * 100;
        }

        const GIFS = [
            { id: '🐹', r: 'common' }, { id: '🐱', r: 'common' }, { id: '🐶', r: 'common' },
            { id: '🦊', r: 'common' }, { id: '🐻', r: 'common' },
            { id: '🐯', r: 'rare' }, { id: '🦁', r: 'rare' }, { id: '🐺', r: 'rare' },
            { id: '👑', r: 'superrare' }, { id: '💎', r: 'superrare' },
            { id: '🌟', r: 'epic' }, { id: '🔥', r: 'epic' }, { id: '🚀', r: 'mythic' },
            { id: '🦄', r: 'legendary' }, { id: '🐲', r: 'legendary' },
            { id: '⚔️', r: 'exclusive' }, { id: '☀️', r: 'summer' }, { id: '🏖️', r: 'summer' },
            { id: '🍉', r: 'summer' }, { id: '🍦', r: 'summer' }, { id: '🏝️', r: 'summer' }
        ];

        const RARITY_PRICES = { common: 50, rare: 150, superrare: 400, epic: 2500, mythic: 7500, legendary: 25000 };

        function hasGif1(id) { return G.game1.ownedGifs[id] && G.game1.ownedGifs[id] > 0; }

        function addGif1(id, n = 1) { G.game1.ownedGifs[id] = (G.game1.ownedGifs[id] || 0) + n; }

        function hasTitle1(id) { return G.game1.ownedTitles[id] && G.game1.ownedTitles[id] > 0; }

        function addTitle1(id, n = 1) { G.game1.ownedTitles[id] = (G.game1.ownedTitles[id] || 0) + n; }

            let seedsBonus = 1 + g.seeds * 0.1 + g.farmUpgrades.seeds * 0.2;

                // XP bar для гри 1
                let cur = LEVELS.find(l => l.l === g1.level) || LEVELS[0];

                let prog = ((g1.xp - cur.x) / (next.x - cur.x)) * 100;

            } else {

                document.getElementById('regenPerSec').textContent = g2.energyRegen;

                let cur = LEVELS.find(l => l.l === g2.level) || LEVELS[0];

                let prog = ((g2.xp - cur.x) / (next.x - cur.x)) * 100;

            }

            g.energy--;

            num.style.left = (x - 20) + 'px';
            num.style.top = (y - 30) + 'px';
            document.body.appendChild(num);
            setTimeout(() => num.remove(), 800);

                        const lastUpdate = data.lastUpdate || 0;

            db.ref('public_users/' + G.uid).set({
                name: G.name,

                avatar: '🎮',

            }).catch(e => console.warn('Public update error:', e));

        function loadGame(data) {
            if (!data) return;
            Object.keys(data).forEach(key => {
                if (key === 'game1') { Object.assign(G.game1, data.game1); } else if (key === 'game2') { Object
                        .assign(G.game2, data.game2); } else if (key === 'game1Coins') { G.game1.coins = data
                        .game1Coins; } else if (key === 'game2Coins') { G.game2.coins = data.game2Coins; } else if (
                    key !== 'uid' && key !== 'lastSave' && key !== 'lastUserActivity') {
                    G[key] = data[key];
                }
            });
            G.game1.maxEnergy = calcMaxEnergy1();
            G.game1.energy = Math.min(G.game1.energy, G.game1.maxEnergy);
            G.game2.maxEnergy = calcMaxEnergy2();
            G.game2.energy = Math.min(G.game2.energy, G.game2.maxEnergy);
            checkLevelUp(1);
            checkLevelUp(2);
            updateUI();
        }

        function handleRegister() {
            if (!auth) { document.getElementById('authError').textContent = '❌ Firebase не готовий.';
                return; }
            const nick = document.getElementById('authNick').value.trim();
            const pass = document.getElementById('authPass').value;
            const error = document.getElementById('authError');
            const success = document.getElementById('authSuccess');
            if (!nick || !pass) { error.textContent = '❌ Введіть нік та пароль';
                return; }
            if (nick.length < 3) { error.textContent = '❌ Нік ≥3';
                return; }
            if (pass.length < 6) { error.textContent = '❌ Пароль ≥6';
                return; }
            error.textContent = '';
            success.textContent = '⏳ Реєстрація...';
            const email = nick.toLowerCase().replace(/[^a-z0-9]/g, '') + '@hamka.ua';

            auth.createUserWithEmailAndPassword(email, pass)
                .then(userCredential => {
                    const uid = userCredential.user.uid;
                    G.uid = uid;
                    G.isTelegramUser = false;
                    G.isGuest = false;
                    G.name = nick;
                    G.season = 2;
                    saveGame();
                    success.textContent = '✅ Реєстрація виконана!';
                    error.textContent = '';
                    startGame();
                })
                .catch(e => {
                    console.error('Register error:', e);
                    if (e.code === 'auth/email-already-in-use') {
                        error.textContent = '❌ Користувач вже існує';
                    } else {
                        error.textContent = '❌ ' + e.message;
                    }
                    success.textContent = '';
                });
        }

        function handleLogin() {
            if (!auth) { document.getElementById('authError').textContent = '❌ Firebase не готовий.';
                return; }
            const nick = document.getElementById('authNick').value.trim();
            const pass = document.getElementById('authPass').value;
            const error = document.getElementById('authError');
            const success = document.getElementById('authSuccess');
            if (!nick || !pass) { error.textContent = '❌ Введіть нік та пароль';
                return; }
            if (nick.length < 3) { error.textContent = '❌ Нік ≥3';
                return; }
            if (pass.length < 6) { error.textContent = '❌ Пароль ≥6';
                return; }
            error.textContent = '';
            success.textContent = '⏳ Вхід...';
            const email = nick.toLowerCase().replace(/[^a-z0-9]/g, '') + '@hamka.ua';

            auth.signInWithEmailAndPassword(email, pass)
                .then(userCredential => {
                    G.uid = userCredential.user.uid;
                    G.isTelegramUser = false;
                    G.isGuest = false;
                    G.name = nick;
                    db.ref('users/' + G.uid).once('value').then(snap => {
                        if (snap.val()) { loadGame(snap.val()); } else { saveGame(); }
                        success.textContent = '✅ Вхід виконано!';
                        error.textContent = '';
                        startGame();
                    });
                })
                .catch(e => {
                    console.error('Login error:', e);
                    if (e.code === 'auth/user-not-found') {
                        error.textContent = '❌ Користувача не знайдено';
                    } else if (e.code === 'auth/wrong-password') {
                        error.textContent = '❌ Невірний пароль';
                    } else {
                        error.textContent = '❌ ' + e.message;
                    }
                    success.textContent = '';
                });
        }

        function handleTelegramLogin() {
            if (!auth) {
                document.getElementById('authError').textContent = '❌ Firebase не готовий.';
                return;
            }
            const error = document.getElementById('authError');
            const success = document.getElementById('authSuccess');
            error.textContent = '';
            success.textContent = '⏳ Вхід через Telegram...';

            auth.signInWithPopup(new firebase.auth.TwitterAuthProvider()).catch(e => {
                // Якщо Twitter не налаштовано, використовуємо гість + Telegram
                const uid = 'tg_' + Date.now();
                G.uid = uid;
                G.isTelegramUser = true;
                G.isGuest = false;
                G.name = '👤 TelegramUser';
                G.season = 2;
                saveGame();
                success.textContent = '✅ Вхід через Telegram!';
                error.textContent = '';
                startGame();
            });
        }

        function handleGuest() {
            if (!auth) {
                document.getElementById('authError').textContent = '❌ Firebase не готовий.';
                return;
            }
            const error = document.getElementById('authError');
            const success = document.getElementById('authSuccess');
            error.textContent = '';
            success.textContent = '⏳ Вхід як гість...';

            auth.signInAnonymously()
                .then(userCredential => {
                    const uid = userCredential.user.uid;
                    G.uid = uid;
                    G.isTelegramUser = false;
                    G.isGuest = true;
                    G.name = 'Гість';
                    G.season = 2;
                    db.ref('users/' + uid).once('value').then(snap => {
                        if (snap.val()) {
                            const data = snap.val();
                            data.isGuest = true;
                            loadGame(data);
                        } else {
                            saveGame();
                        }
                        success.textContent = '✅ Гостьовий вхід!';
                        error.textContent = '';
                        startGame();
                    });
                })
                .catch(e => {
                    console.error('Guest error:', e);
                    error.textContent = '❌ ' + e.message;
                    success.textContent = '';
                });
        }

        async function convertGuestToAccount() {
            if (!G.isGuest) { toast('Ви вже маєте акаунт'); return; }
            if (!auth) { toast('Firebase не готовий'); return; }

            const error = document.getElementById('authError');
            const success = document.getElementById('authSuccess');

            const nick = prompt('Введіть нікнейм для акаунта (мін. 3 символи):');
            if (!nick || nick.length < 3) { toast('Нік має бути не менше 3 символів'); return; }

            const pass = prompt('Введіть пароль (мін. 6 символів):');
            if (!pass || pass.length < 6) { toast('Пароль має бути не менше 6 символів'); return; }

            try {
                const guestData = { ...G };
                const guestUid = G.uid;

                const email = nick.toLowerCase().replace(/[^a-z0-9]/g, '') + '@hamka.ua';
                const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
                const newUid = userCredential.user.uid;

                G.uid = newUid;
                G.isGuest = false;
                G.name = nick;
                G.isTelegramUser = false;

                await db.ref('users/' + newUid).set({
                    ...guestData,
                    uid: newUid,
                    name: nick,
                    isGuest: false,
                    isTelegramUser: false,
                    lastUpdate: Date.now()
                });

                if (guestUid) {
                    try {
                        await db.ref('users/' + guestUid).remove();
                        await db.ref('public_users/' + guestUid).remove();
                    } catch (e) { console.warn('Old guest data deletion error:', e); }
                }

                loadGame({ ...guestData, uid: newUid, name: nick, isGuest: false });
                saveGame();

                toast('✅ Акаунт створено! Ваш прогрес збережено.');
                if (success) success.textContent = '✅ Акаунт створено!';
                if (error) error.textContent = '';

                renderProfile();
                updateUI();

            } catch (e) {
                console.error('Conversion error:', e);
                if (e.code === 'auth/email-already-in-use') {
                    toast('❌ Користувач з таким ніком вже існує');
                } else {
                    toast('❌ Помилка: ' + e.message);
                }
                if (error) error.textContent = '❌ ' + e.message;
            }
        }

        function logout() {
            if (G.isGuest) {
                if (confirm('Ви в гостьовому режимі. Прогрес буде втрачено при виході. Продовжити?')) {
                    localStorage.removeItem('hamka_guest_save');
                    location.reload();
                }
                return;
            }
            if (confirm('Ви впевнені, що хочете вийти?')) {
                auth.signOut().then(() => { location.reload(); }).catch(e => { location.reload(); });
            }
        }

        function deleteAccount() {
            if (!G.uid) { toast('❌ Немає акаунта'); return; }
            if (!confirm('⚠️ ВИ ВПЕВНЕНІ? Це видалить ВЕСЬ ваш прогрес назавжди!')) return;
            if (!confirm('🔄 ДРУГЕ ПІДТВЕРДЖЕННЯ: Всі дані будуть втрачені!')) return;

            toast('⏳ Видалення акаунта...');

            const deletePromises = [];
            deletePromises.push(db.ref('users/' + G.uid).remove().catch(e => console.warn('User delete error:', e)));
            deletePromises.push(db.ref('public_users/' + G.uid).remove().catch(e => console.warn('Public delete error:',
                e)));

            if (!G.isTelegramUser && auth.currentUser) {
                deletePromises.push(auth.currentUser.delete().catch(e => {
                    console.warn('Auth delete error:', e);
                    auth.signOut();
                }));
            }

            Promise.all(deletePromises).then(() => {
                toast('✅ Акаунт видалено!');
                localStorage.removeItem('hamka_guest_save');
                setTimeout(() => { location.reload(); }, 1000);
            }).catch(e => {
                console.error('Delete error:', e);
                toast('❌ Помилка видалення: ' + e.message);
            });
        }

        function activatePromo() {
            let code = document.getElementById('promoInp').value.trim().toUpperCase();
            if (!code) { toast('❌ Введіть промокод'); return; }

            if (code === 'START') {
                G.game1.coins += 1000;
                G.game2.coins += 500;
                toast('💰 +1000 в обидві гри!');
            } else if (code === 'VIP') {
                if (!G.game1.vip) { G.game1.vip = true;
                    G.game1.luck = Math.min(G.game1.luck + 0.1, 1.3);
                    toast('👑 VIP!'); } else { toast('VIP вже є'); }
            } else if (code === 'FARM') {
                G.game2.seeds += 50;
                toast('🌱 +50 насіння!');
            } else if (code === 'CRYPTO') {
                G.game1.coins += 5000;
                toast('🟢 +5000 монет!');
            } else {
                toast('❌ Невірний код');
            }
            document.getElementById('promoInp').value = '';
            updateUI();
            saveGame();
        }

        // ============================================================
        //  🚀 СТАРТ ГРИ
        // ============================================================
        function startGame() {
            if (gameStarted) return;
            gameStarted = true;
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('game').style.display = 'flex';
            updateUI();
            buildPages();

            setInterval(() => {
                // Автоматичне відновлення енергії для обох ігор
                let g1 = G.game1;
                let regen1 = g1.energyRegen + g1.upgrades.energyRegen;
                g1.energy = Math.min(g1.maxEnergy, g1.energy + regen1);

                let g2 = G.game2;
                g2.energy = Math.min(g2.maxEnergy, g2.energy + g2.energyRegen);

                // Авто-тап для гри 1
                if (g1.autoTap > 0) {
                    g1.coins += g1.autoTap;
                }

                // Авто-збір для гри 2
                if (g2.autoFarm + g2.farmUpgrades.autoFarm > 0) {
                    let autoAmount = g2.autoFarm + g2.farmUpgrades.autoFarm;
                    if (g2.seeds >= autoAmount) {
                        g2.seeds -= autoAmount;
                        let harvest = calcHarvest2() * autoAmount;
                        g2.wheat += harvest;
                        g2.coins += harvest * 2;
                        addXP(2, harvest);
                    }
                }

                updateUI();
                saveGame();
            }, 2000);

            toast('🎮 Один акаунт — дві гри!');
        }

        function buildPages() {
            const area = document.getElementById('contentArea');
            area.innerHTML = `
                <div id="tab-game" class="page show"><div id="game-area"></div></div>
                <div id="tab-shop" class="page"><div id="shop-content"></div></div>
                <div id="tab-profile" class="page"><div id="profile-area"></div></div>
                <div id="tab-top" class="page"><div id="top-area"></div></div>
            `;
            renderGamePage();
        }

        // ============================================================
        //  🔄 АВТОВХІД
        // ============================================================
        document.getElementById('authStatus').textContent = '🔐 Виберіть спосіб входу';

        if (!authListenerSet) {
            authListenerSet = true;
            auth?.onAuthStateChanged(user => {
                if (user && !gameStarted) {
                    G.uid = user.uid;
                    G.isTelegramUser = false;
                    G.isGuest = user.isAnonymous || false;
                    db.ref('users/' + user.uid).once('value').then(snap => {
                        if (snap.val()) {
                            const data = snap.val();
                            data.isGuest = G.isGuest;
                            loadGame(data);
                        } else {
                            G.name = user.isAnonymous ? 'Гість' : 'Гравець';
                            G.season = 2;
                            saveGame();
                        }
                        startGame();
                    }).catch(e => {
                        console.error('Load error:', e);
                        startGame();
                    });
                } else if (!user && !gameStarted) {
                    document.getElementById('authScreen').style.display = 'flex';
                    document.getElementById('game').style.display = 'none';
                }
            });
        }

        console.log('🎮 Hamka Games — Один акаунт для всіх ігор!');
        console.log('🟢 Гра 1: Крипто-клікер');
        console.log('🔴 Гра 2: Ферма');
        console.log('✅ Реєстрація через пароль або Telegram');
        console.log('✅ Гостьовий режим');
        console.log('✅ Одна база даних для всіх ігор (як Supercell ID)');
    </script>
</body>
</html>
