<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamka Game</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <h2 id="user-name">Завантаження...</h2>
  <div style="font-size:48px; color:#f5a623; margin:20px 0;">
    🪙 <span id="coin-display">0</span>
  </div>
  <button id="get-coin-btn" style="padding:15px 30px; font-size:18px; background:#4caf50; color:white; border:none; border-radius:10px;">
    +10 монет
  </button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // ⚠️ ЗАМІНІТЬ на свої дані з Firebase Console → Налаштування проекту
    const firebaseConfig = {
      apiKey: "ВАШ_API_KEY",
      authDomain: "hamka-game.firebaseapp.com",
      databaseURL: "https://hamka-game-default-rtdb.firebaseio.com",
      projectId: "hamka-game",
      storageBucket: "hamka-game.appspot.com",
      messagingSenderId: "ВАШ_SENDER_ID",
      appId: "ВАШ_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    const user = tg.initDataUnsafe?.user;
    const statusEl = document.getElementById('status');

    if (!user) {
      document.getElementById('user-name').innerText = "❌ Не вдалося отримати Telegram user";
    } else {
      const userId = user.id.toString();
      const userName = user.username || user.first_name || "Гравець";
      document.getElementById('user-name').innerText = `Привіт, ${userName}!`;

      // Завантаження балансу
      async function loadBalance() {
        const snap = await get(ref(db, 'users/' + userId + '/coins'));
        document.getElementById('coin-display').innerText = snap.exists() ? snap.val() : 0;
      }
      loadBalance();

      // Кнопка "+10 монет"
      document.getElementById('get-coin-btn').addEventListener('click', async () => {
        const coinRef = ref(db, 'users/' + userId + '/coins');
        const snap = await get(coinRef);
        const current = snap.exists() ? snap.val() : 0;
        const newBalance = current + 10;
        await set(coinRef, newBalance);
        document.getElementById('coin-display').innerText = newBalance;
        tg.HapticFeedback.impactOccurred('light'); // вібрація
      });
    }
  </script>
</body>
</html>
