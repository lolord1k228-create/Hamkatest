<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hamka Game</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000; color: #fff; user-select: none;
    }
    body {
      display: flex; flex-direction: column; position: relative;
      background: radial-gradient(circle at 50% 30%, #1a1a1a 0%, #000 70%);
    }

    /* ===== Екран авторизації ===== */
    #auth-screen {
      position: fixed; inset: 0; z-index: 1000; background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; transition: opacity 0.3s, visibility 0.3s;
    }
    #auth-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .auth-logo { font-size: 72px; margin-bottom: 16px; }
    .auth-title { font-size: 24px; font-weight: 700; color: #f5a623; margin-bottom: 8px; }
    .auth-subtitle { font-size: 13px; color: #888; margin-bottom: 32px; text-align: center; }
    .auth-form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }
    .auth-input {
      width: 100%; padding: 14px 16px; background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
      color: #fff; font-size: 15px; outline: none;
    }
    .auth-input:focus { border-color: #f5a623; }
    .auth-btn {
      padding: 14px; border: none; border-radius: 12px; font-size: 15px;
      font-weight: 700; cursor: pointer; transition: transform 0.1s;
    }
    .auth-btn:active { transform: scale(0.97); }
    .auth-btn:disabled { opacity: 0.5; }
    .auth-btn.primary { background: linear-gradient(135deg, #f5a623, #d4891a); color: #000; }
    .auth-btn.telegram { background: #2aabee; color: #fff; margin-top: 8px; }
    .auth-divider { display: flex; align-items: center; gap: 12px; color: #555; font-size: 12px; margin: 8px 0; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.08); }
    .auth-switch { margin-top: 20px; font-size: 13px; color: #888; }
    .auth-switch a { color: #f5a623; cursor: pointer; font-weight: 600; }
    .auth-error { color: #ff6b6b; font-size: 12px; text-align: center; min-height: 18px; }
    .auth-hint { color: #888; font-size: 11px; text-align: center; margin-top: 6px; }

    /* ===== Гра ===== */
    #game-screen { display: none; flex-direction: column; height: 100%; }
    #game-screen.visible { display: flex; }

    /* Верхня панель статистики */
    .top-stats {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: #000;
      font-size: 12px; font-weight: 600;
      border-bottom: 1px solid #222;
    }
    .top-stats-group { display: flex; gap: 10px; align-items: center; }
    .stat-pill {
      display: flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,0.05); padding: 3px 8px; border-radius: 6px;
    }
    .stat-pill .icon { font-size: 12px; }
    .season-badge {
      background: #f5a623; color: #000; padding: 4px 10px;
      border-radius: 20px; font-size: 11px; font-weight: 700;
      display: flex; align-items: center; gap: 4px;
    }

    /* Горизонтальне меню */
    .main-menu {
      display: flex; justify-content: space-around; align-items: center;
      padding: 10px 6px; background: #111;
      border-bottom: 1px solid #222;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .main-menu::-webkit-scrollbar { display: none; }
    .menu-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; color: #666; font-size: 10px; font-weight: 600;
      min-width: 50px; cursor: pointer;
    }
    .menu-item.active { color: #fff; }
    .menu-item.active .menu-icon-wrap {
      background: #2ecc71; color: #000;
      box-shadow: 0 0 12px rgba(46, 204, 113, 0.5);
    }
    .menu-icon-wrap {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; background: rgba(255,255,255,0.05);
      color: #888;
    }

    /* Кольорові кнопки */
    .action-buttons {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px;
      background: #000;
    }
    .color-btn {
      flex: 1; min-width: 70px;
      padding: 8px 10px; border: none; border-radius: 20px;
      font-size: 12px; font-weight: 700; color: #fff;
      display: flex; align-items: center; justify-content: center; gap: 4px;
      cursor: pointer;
    }
    .color-btn:active { opacity: 0.8; }
    .btn-tap { background: #2ecc71; color: #000; }
    .btn-crypto { background: #f39c12; }
    .btn-garage { background: #9b59b6; }
    .btn-daily { background: #e67e22; }
    .btn-extra { background: #e91e63; }

    /* Зона тапання */
    .tap-area {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    .coin-counter {
      display: flex; align-items: center; gap: 6px;
      font-size: 22px; font-weight: 700; color: #fff;
      margin-bottom: 20px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .coin-counter .coin-icon { font-size: 20px; }

    .hamster-wrap {
      position: relative; display: flex; align-items: center; justify-content: center;
      width: 320px; height: 320px;
      max-width: 85vw; max-height: 85vw;
    }
    .hamster {
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 4px solid #2ecc71;
      box-shadow: 0 0 30px rgba(46, 204, 113, 0.6), inset 0 0 40px rgba(46, 204, 113, 0.15);
      background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #0a0a0a 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 140px;
      cursor: pointer;
      transition: transform 0.1s ease;
      position: relative;
      z-index: 2;
    }
    .hamster:active { transform: scale(0.96); }
    
    .tap-effect {
      position: absolute; font-size: 28px; font-weight: 800; color: #2ecc71;
      pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 10;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
    }

    /* Крипта */
    .page { display: none; flex: 1; flex-direction: column; overflow-y: auto; }
    .page.active { display: flex; }
    .crypto-page { padding: 8px 12px 100px; }

    .crypto-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px; padding: 12px; margin-bottom: 10px;
    }
    .crypto-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .crypto-symbol { font-size: 16px; font-weight: 700; color: #f5a623; }
    .crypto-price { font-size: 15px; font-weight: 700; }
    .crypto-price.up { color: #2ecc71; }
    .crypto-price.down { color: #ff5252; }
    .crypto-chart {
      width: 100%; height: 60px; display: block;
      background: rgba(0, 0, 0, 0.3); border-radius: 8px; margin-bottom: 8px;
    }
    .crypto-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .crypto-input {
      width: 60px; flex-shrink: 0; padding: 8px;
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px; color: #fff; font-size: 14px; outline: none;
      -moz-appearance: textfield;
    }
    .crypto-input::-webkit-outer-spin-button,
    .crypto-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .crypto-btn {
      flex: 1; min-width: 0; padding: 8px; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .crypto-btn.buy { background: #2ecc71; color: #000; }
    .crypto-btn.sell { background: #ff5252; color: #fff; }
    .crypto-holdings { font-size: 11px; color: #888; margin-top: 6px; }
    .crypto-holdings span { color: #f5a623; font-weight: 600; }

    /* Нижня панель */
    .bottom-panel {
      background: #0a0a0a; border-top: 1px solid #222;
      padding: 6px 12px 10px;
    }
    .bottom-stats {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: #aaa; margin-bottom: 4px;
    }
    .bottom-stats span { display: flex; align-items: center; gap: 3px; }
    .energy-bar-wrap {
      width: 100%; height: 10px; background: #222;
      border-radius: 5px; overflow: hidden; position: relative;
    }
    .energy-bar {
      height: 100%; background: linear-gradient(90deg, #f5a623, #ffd700);
      width: 100%; transition: width 0.3s;
    }
    .energy-labels {
      display: flex; justify-content: space-between; font-size: 10px; color: #666;
      margin-top: 2px;
    }
    .coin-bottom {
      text-align: center; font-size: 14px; font-weight: 700; color: #ffd700;
      margin: 6px 0;
    }
    .xp-row {
      display: flex; justify-content: space-between; font-size: 11px; color: #666;
    }
    .promo-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: #888; margin-top: 6px;
    }
    .promo-btn {
      background: #2ecc71; color: #000; border: none; border-radius: 6px;
      padding: 4px 12px; font-size: 11px; font-weight: 700; cursor: pointer;
    }

    #status {
      position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9); padding: 10px 20px; border-radius: 10px;
      font-size: 13px; opacity: 0; transition: opacity 0.3s;
      pointer-events: none; white-space: nowrap; z-index: 100;
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
    }
    #status.show { opacity: 1; }
  </style>
</head>
<body>

  <!-- ===== АВТОРИЗАЦІЯ ===== -->
  <div id="auth-screen">
    <div class="auth-logo">🐭</div>
    <div class="auth-title">Hamka Game</div>
    <div class="auth-subtitle">Увійдіть, щоб грати та зберігати прогрес</div>
    <div class="auth-form">
      <input type="email" id="auth-email" class="auth-input" placeholder="Email" autocomplete="email">
      <input type="password" id="auth-password" class="auth-input" placeholder="Пароль (мін. 6 символів)" autocomplete="current-password">
      <div class="auth-error" id="auth-error"></div>
      <button class="auth-btn primary" id="auth-submit">Увійти</button>
      <div class="auth-hint" id="auth-hint"></div>
      <div class="auth-divider">або</div>
      <button class="auth-btn telegram" id="tg-login-btn">
        <span>✈️</span> Увійти через Telegram
      </button>
    </div>
    <div class="auth-switch">
      <span id="auth-switch-text">Немає акаунту?</span>
      <a id="auth-switch-link">Зареєструватися</a>
    </div>
  </div>

  <!-- ===== ГРА ===== -->
  <div id="game-screen">
    
    <!-- Верхня панель -->
    <div class="top-stats">
      <div class="top-stats-group">
        <div class="stat-pill"><span class="icon">👥</span> Vi</div>
        <div class="stat-pill"><span class="icon">🪙</span> <span id="top-coins">0</span></div>
        <div class="stat-pill"><span class="icon">💎</span> 0</div>
        <div class="stat-pill"><span class="icon">₿</span> 0.00</div>
        <div class="stat-pill"><span class="icon">💵</span> 0.00</div>
        <div class="stat-pill"><span class="icon">⭐</span> 1</div>
      </div>
      <div class="season-badge">🏆 Сезон 2</div>
    </div>

    <!-- Меню -->
    <div class="main-menu">
      <div class="menu-item active" data-page="tap">
        <div class="menu-icon-wrap">🐭</div>
        <span>Гра</span>
      </div>
      <div class="menu-item">
        <div class="menu-icon-wrap">🛒</div>
        <span>Магазин</span>
      </div>
      <div class="menu-item" data-page="crypto">
        <div class="menu-icon-wrap">₿</div>
        <span>Крипта</span>
      </div>
      <div class="menu-item">
        <div class="menu-icon-wrap">👑</div>
        <span>VIP</span>
      </div>
      <div class="menu-item">
        <div class="menu-icon-wrap">👤</div>
        <span>Профіль</span>
      </div>
      <div class="menu-item">
        <div class="menu-icon-wrap">🎒</div>
        <span>Інвентар</span>
      </div>
      <div class="menu-item">
        <div class="menu-icon-wrap">🏆</div>
        <span>Топ</span>
      </div>
    </div>

    <!-- Кольорові кнопки -->
    <div class="action-buttons">
      <button class="color-btn btn-tap">🌿 Тан</button>
      <button class="color-btn btn-crypto" onclick="document.querySelector('[data-page=crypto]').click()">📊</button>
      <button class="color-btn btn-garage">🔧</button>
      <button class="color-btn btn-daily">🐍</button>
      <button class="color-btn btn-extra">🌸</button>
    </div>

    <!-- Сторінка ТАП -->
    <div class="page active" id="page-tap">
      <div class="tap-area" id="tap-area">
        <div class="coin-counter">
          <span class="coin-icon">🪙</span>
          <span id="tap-coin-display">0</span>
        </div>
        <div class="hamster-wrap">
          <div class="hamster" id="hamster">🐭</div>
        </div>
      </div>
    </div>

    <!-- Сторінка КРИПТА -->
    <div class="page crypto-page" id="page-crypto">
      <div id="crypto-list"></div>
    </div>

    <!-- Нижня панель -->
    <div class="bottom-panel">
      <div class="bottom-stats">
        <span>⚡ 100 / 100</span>
        <span>-1 ⚡</span>
        <span>+1 ⚡/сек</span>
        <span>📈 0 🪙/сек</span>
        <span>💵 1000</span>
        <span>🪙 <span id="bottom-coins">971</span></span>
      </div>
      <div class="energy-bar-wrap">
        <div class="energy-bar" id="energy-bar" style="width: 100%;"></div>
      </div>
      <div class="energy-labels">
        <span>Енергія</span>
        <span id="energy-label-text">100/100</span>
      </div>
      <div class="coin-bottom">💰 <span id="bottom-coin-display">550</span></div>
      <div class="xp-row">
        <span>XP: 0</span>
        <span>Рівень 1</span>
      </div>
      <div class="promo-row">
        <span>🎁 Промокод</span>
        <button class="promo-btn">OK</button>
      </div>
    </div>
  </div>

  <div id="status"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get, set, update, runTransaction, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD1-UDrqRzfUw_32nOzqT2mAozzab5DJZk",
      authDomain: "hamka-game.firebaseapp.com",
      databaseURL: "https://hamka-game-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "hamka-game",
      storageBucket: "hamka-game.firebasestorage.app",
      messagingSenderId: "975050013138",
      appId: "1:975050013138:web:19f42c1c5f2b2d35d6300b",
      measurementId: "G-W4G3ZZ5R68"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const tg = window.Telegram.WebApp;
    try { tg.expand(); tg.ready(); } catch(e) {}

    // === DOM ===
    const authScreen = document.getElementById('auth-screen');
    const gameScreen = document.getElementById('game-screen');
    const authEmail = document.getElementById('auth-email');
    const authPassword = document.getElementById('auth-password');
    const authError = document.getElementById('auth-error');
    const authHint = document.getElementById('auth-hint');
    const authSubmit = document.getElementById('auth-submit');
    const authSwitchText = document.getElementById('auth-switch-text');
    const authSwitchLink = document.getElementById('auth-switch-link');
    const tgLoginBtn = document.getElementById('tg-login-btn');
    const logoutBtn = document.getElementById('logout-btn'); // прибрано, але для сумісності

    const tapCoinDisplay = document.getElementById('tap-coin-display');
    const topCoins = document.getElementById('top-coins');
    const bottomCoins = document.getElementById('bottom-coins');
    const bottomCoinDisplay = document.getElementById('bottom-coin-display');
    
    const energyDisplay = document.getElementById('energy-label-text');
    const energyBar = document.getElementById('energy-bar');
    const hamster = document.getElementById('hamster');
    const tapArea = document.getElementById('tap-area');
    const statusEl = document.getElementById('status');
    const cryptoListEl = document.getElementById('crypto-list');

    // === Стан ===
    let isLoginMode = true;
    let state = { coins: 0, energy: 200, maxEnergy: 200, holdings: {} };
    let pendingTap = false;
    let unsubscribeUserData = null;
    let energyInterval = null;
    let cryptoInterval = null;
    let currentUid = null;

    const COINS = ['OLDHAM', 'NEWHAM', 'HAM', 'BHAM', 'PLAYERHOM'];
    const INITIAL_PRICES = {
      OLDHAM: 100, NEWHAM: 250, HAM: 500, BHAM: 1000, PLAYERHOM: 50
    };
    const PLAYERHOM_BASE = 50;
    const PLAYERHOM_PER_UNIT = 2;

    function getQty(symbol) {
      const v = localStorage.getItem('qty_' + symbol);
      return v ? Math.max(1, parseInt(v) || 1) : 1;
    }
    function setQty(symbol, val) {
      localStorage.setItem('qty_' + symbol, val);
    }

    function showStatus(text) {
      statusEl.innerText = text;
      statusEl.classList.add('show');
      clearTimeout(showStatus._t);
      showStatus._t = setTimeout(() => statusEl.classList.remove('show'), 2000);
    }

    function formatNumber(num) {
      if (num >= 1e9) return (num / 1e9).toFixed(1) + 'B';
      if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
      if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
      return Math.floor(num).toString();
    }

    function formatPrice(p) {
      if (p >= 1e6) return (p / 1e6).toFixed(2) + 'M';
      if (p >= 1e3) return (p / 1e3).toFixed(2) + 'K';
      return p.toFixed(2);
    }

    function getTelegramNick(tgUser) {
      if (!tgUser) return null;
      if (tgUser.username) return '@' + tgUser.username;
      if (tgUser.first_name) return tgUser.first_name;
      return 'Гравець';
    }

    function getAuthErrorMessage(err) {
      const messages = {
        'auth/invalid-email': 'Невірний формат email',
        'auth/user-not-found': 'Користувача не знайдено. Зареєструйтесь.',
        'auth/wrong-password': 'Невірний пароль',
        'auth/email-already-in-use': 'Цей email вже зареєстровано. Увійдіть.',
        'auth/weak-password': 'Пароль занадто слабкий (мін. 6 символів)',
        'auth/invalid-credential': 'Невірний email або пароль',
        'auth/too-many-requests': 'Занадто багато спроб. Зачекайте.',
        'auth/network-request-failed': 'Мережева помилка. Перевірте інтернет.',
        'auth/operation-not-allowed': 'Email/Password не увімкнено у Firebase Console',
        'auth/unauthorized-domain': 'Домен не авторизований у Firebase Console',
        'auth/internal-error': 'Внутрішня помилка Firebase. Спробуйте ще раз.'
      };
      return messages[err.code] || err.message || 'Невідома помилка';
    }

    async function authWithRetry(action, email, password, maxRetries = 2) {
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
          if (action === 'login') return await signInWithEmailAndPassword(auth, email, password);
          else return await createUserWithEmailAndPassword(auth, email, password);
        } catch (err) {
          if (err.code === 'auth/network-request-failed' && attempt < maxRetries) {
            authError.innerText = `Мережева помилка. Спроба ${attempt + 1}/${maxRetries}...`;
            await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
            continue;
          }
          throw err;
        }
      }
    }

    function switchAuthMode() {
      isLoginMode = !isLoginMode;
      authSubmit.innerText = isLoginMode ? 'Увійти' : 'Зареєструватися';
      authSwitchText.innerText = isLoginMode ? 'Немає акаунту?' : 'Вже є акаунт?';
      authSwitchLink.innerText = isLoginMode ? 'Зареєструватися' : 'Увійти';
      authError.innerText = '';
      authHint.innerText = '';
    }
    authSwitchLink.addEventListener('click', switchAuthMode);

    authSubmit.addEventListener('click', async () => {
      const email = authEmail.value.trim();
      const password = authPassword.value;
      if (!email || !password) { authError.innerText = 'Заповніть email та пароль'; return; }
      if (!email.includes('@')) { authError.innerText = 'Введіть коректний email'; return; }
      if (password.length < 6) { authError.innerText = 'Пароль має бути мінімум 6 символів'; return; }

      authSubmit.disabled = true;
      authError.innerText = '';
      authHint.innerText = '';
      try {
        await authWithRetry(isLoginMode ? 'login' : 'register', email, password);
      } catch (err) {
        authError.innerText = getAuthErrorMessage(err);
        if (err.code === 'auth/unauthorized-domain') {
          authHint.innerText = 'Додайте домен у Firebase Console → Authentication → Settings → Authorized domains';

      }
      const fakeEmail = `tg_${tgUser.id}@hamka.test`;
      const fakePassword = `tg_${tgUser.id}_secret_hamka`;
      const nick = getTelegramNick(tgUser);

      tgLoginBtn.disabled = true;
      authError.innerText = '';
      authHint.innerText = '';
      try {
        try {
          await signInWithEmailAndPassword(auth, fakeEmail, fakePassword);
        } catch (e) {
          if (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') {
            await createUserWithEmailAndPassword(auth, fakeEmail, fakePassword);
          } else {

          }
        }
        showStatus(`✅ Вітаємо, ${nick}!`);

      } finally {
