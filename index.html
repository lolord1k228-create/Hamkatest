<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hamka Farm</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      user-select: none;
    }
    .balance {
      font-size: 56px;
      font-weight: 700;
      color: #ffd700;
      margin-bottom: 40px;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }
    .balance span { font-size: 32px; }
    .farm-btn {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 30% 30%, #f5a623, #d4891a);
      font-size: 80px;
      cursor: pointer;
      transition: transform 0.1s ease;
      box-shadow: 0 10px 30px rgba(245, 166, 35, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .farm-btn:active { transform: scale(0.92); }
    .farm-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .tap-effect {
      position: fixed;
      font-size: 24px;
      font-weight: bold;
      color: #ffd700;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 10;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
    }
    #status {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }
    #status.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="balance">🪙 <span id="coin-display">0</span></div>

  <button class="farm-btn" id="farm-btn">🐹</button>

  <div id="status"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, runTransaction, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // === Firebase Config — ЗАМІНІТЬ НА СВОЇ ===
    const firebaseConfig = {
      apiKey: "ВАШ_API_KEY",
      authDomain: "hamka-game.firebaseapp.com",
      databaseURL: "https://hamka-game-default-rtdb.firebaseio.com",
      projectId: "hamka-game",
      storageBucket: "hamka-game.appspot.com",
      messagingSenderId: "ВАШ_SENDER_ID",
      appId: "ВАШ_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // === Telegram ===
    const tg = window.Telegram.WebApp;
    try { tg.expand(); tg.ready(); } catch(e) {}

    const tgUser = tg.initDataUnsafe?.user;
    const userId = tgUser ? tgUser.id.toString() : "test_user_123";

    const coinsRef = ref(db, 'users/' + userId + '/coins');
    const coinDisplay = document.getElementById('coin-display');
    const farmBtn = document.getElementById('farm-btn');
    const statusEl = document.getElementById('status');

    function showStatus(text) {
      statusEl.innerText = text;
      statusEl.classList.add('show');
      clearTimeout(showStatus._t);
      showStatus._t = setTimeout(() => statusEl.classList.remove('show'), 1500);
    }

    // === Слухаємо баланс у реальному часі ===
    onValue(coinsRef, (snap) => {
      coinDisplay.innerText = snap.val() || 0;
    });

    // === Кнопка фарму: +1 монета за тап ===
    farmBtn.addEventListener('click', async (e) => {
      // Анімація +1
      const effect = document.createElement('div');
      effect.className = 'tap-effect';
      effect.innerText = '+1';
      effect.style.left = (e.clientX - 10) + 'px';
      effect.style.top = (e.clientY - 10) + 'px';
      document.body.appendChild(effect);
      setTimeout(() => effect.remove(), 800);

      try { tg.HapticFeedback.impactOccurred('light'); } catch(e) {}

      try {
        await runTransaction(coinsRef, (current) => (current || 0) + 1);
      } catch (err) {
        console.error(err);
        showStatus("❌ Помилка: " + err.message);
      }
    });
  </script>
</body>
</html>
