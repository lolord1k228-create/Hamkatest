<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hamka Kombat</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1e;
      color: #fff;
      user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
      position: relative;
      background:
        radial-gradient(circle at 50% 20%, rgba(245, 166, 35, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 50% 100%, rgba(76, 175, 80, 0.1) 0%, transparent 50%),
        #0f0f1e;
    }

    /* ===== Верхня панель ===== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 5;
    }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, #f5a623, #d4891a);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; color: #1a1a2e;
      box-shadow: 0 0 12px rgba(245, 166, 35, 0.4);
    }
    .user-name { font-size: 14px; font-weight: 600; }
    .user-level {
      font-size: 11px; color: #f5a623; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .exchange-badge {
      background: rgba(245, 166, 35, 0.15);
      border: 1px solid rgba(245, 166, 35, 0.3);
      padding: 6px 12px; border-radius: 20px;
      font-size: 12px; color: #f5a623; font-weight: 600;
    }

    /* ===== Панель статистики ===== */
    .stats-bar {
      display: flex;
      justify-content: space-around;
      padding: 14px 12px;
      background: rgba(0, 0, 0, 0.25);
      margin: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .stat-item { text-align: center; flex: 1; }
    .stat-item + .stat-item { border-left: 1px solid rgba(255, 255, 255, 0.08); }
    .stat-label {
      font-size: 10px; color: #888;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 3px;
    }
    .stat-value { font-size: 17px; font-weight: 700; color: #f5a623; }
    .stat-value.coin { color: #ffd700; }
    .stat-value.energy { color: #4caf50; }

    /* ===== Зона тапання ===== */
    .tap-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px;
      overflow: hidden;
    }
    .hamster-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 240px;
      height: 240px;
    }
    .hamster-wrap::before {
      content: '';
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 166, 35, 0.25), transparent 70%);
      animation: pulseGlow 2s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    .hamster {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle at 35% 30%, #ffd27a, #f5a623 40%, #d4891a);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 100px;
      cursor: pointer;
      transition: transform 0.1s ease;
      box-shadow:
        0 10px 40px rgba(245, 166, 35, 0.4),
        inset 0 -8px 20px rgba(0, 0, 0, 0.2),
        inset 0 8px 20px rgba(255, 255, 255, 0.3);
      position: relative;
      z-index: 2;
    }
    .hamster:active { transform: scale(0.92); }
    .tap-hint {
      margin-top: 24px;
      font-size: 13px;
      color: #888;
      text-align: center;
    }
    .tap-effect {
      position: absolute;
      font-size: 26px;
      font-weight: 800;
      color: #ffd700;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 10;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-90px) scale(1.4); }
    }

    /* ===== Нижня навігація ===== */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      padding: 10px 0 14px;
      background: rgba(0, 0, 0, 0.5);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 4px; color: #666; font-size: 10px;
      cursor: pointer; transition: color 0.2s;
      flex: 1;
    }
    .nav-item.active { color: #f5a623; }
    .nav-icon { font-size: 22px; }

    /* ===== Статус ===== */
    #status {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #status.show { opacity: 1; }
  </style>
</head>
<body>

  <!-- Верхня панель -->
  <div class="top-bar">
    <div class="user-info">
      <div class="avatar" id="avatar">H</div>
      <div>
        <div class="user-name" id="user-name">Завантаження...</div>
        <div class="user-level" id="user-level">Bronze</div>
      </div>
    </div>
    <div class="exchange-badge">🏦 Binance</div>
  </div>

  <!-- Статистика -->
  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-label">Монети</div>
      <div class="stat-value coin" id="coin-display">0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Прибуток/год</div>
      <div class="stat-value" id="profit-display">+0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Енергія</div>
      <div class="stat-value energy" id="energy-display">1000/1000</div>
    </div>
  </div>

  <!-- Зона тапання -->
  <div class="tap-area" id="tap-area">
    <div class="hamster-wrap">
      <div class="hamster" id="hamster">🐹</div>
    </div>
    <div class="tap-hint">Натискай на хом'яка 🐹</div>
  </div>

  <!-- Нижня навігація -->
  <div class="bottom-nav">
    <div class="nav-item active"><span class="nav-icon">🐹</span><span>Грати</span></div>
    <div class="nav-item"><span class="nav-icon">⛏️</span><span>Майнінг</span></div>
    <div class="nav-item"><span class="nav-icon">👥</span><span>Друзі</span></div>
    <div class="nav-item"><span class="nav-icon">🚀</span><span>Бусти</span></div>
  </div>

  <div id="status"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get, set, update, runTransaction, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // === Firebase Config — ЗАМІНІТЬ НА СВОЇ ===
    const firebaseConfig = {
      apiKey: "ВАШ_API_KEY",
      authDomain: "hamka-game.firebaseapp.com",
      databaseURL: "https://hamka-game-default-rtdb.firebaseio.com",
      projectId: "hamka-game",
      storageBucket: "hamka-game.appspot.com",
      messagingSenderId: "ВАШ_SENDER_ID",
      appId: "ВАШ_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // === Telegram ===
    const tg = window.Telegram.WebApp;
    try { tg.expand(); tg.ready(); } catch(e) {}

    const tgUser = tg.initDataUnsafe?.user;
    const userId = tgUser ? tgUser.id.toString() : "test_user_123";
    const userName = tgUser ? (tgUser.username || tgUser.first_name || "Гравець") : "Тестовий гравець";

    document.getElementById('user-name').innerText = userName;
    document.getElementById('avatar').innerText = userName.charAt(0).toUpperCase();

    // === DOM ===
    const coinDisplay = document.getElementById('coin-display');
    const profitDisplay = document.getElementById('profit-display');
    const energyDisplay = document.getElementById('energy-display');
    const hamster = document.getElementById('hamster');
    const tapArea = document.getElementById('tap-area');
    const statusEl = document.getElementById('status');

    // === State ===
    let state = {
      coins: 0,
      profitPerHour: 100,
      energy: 1000,
      maxEnergy: 1000,
      lastMiningClaim: Date.now()
    };

    let isTapping = false; // захист від спаму

    function showStatus(text) {
      statusEl.innerText = text;
      statusEl.classList.add('show');
      clearTimeout(showStatus._t);
      showStatus._t = setTimeout(() => statusEl.classList.remove('show'), 1800);
    }

    function formatNumber(num) {
      if (num >= 1e9) return (num / 1e9).toFixed(1) + 'B';
      if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
      if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
      return Math.floor(num).toString();
    }

    // === Refs ===
    const userRef = ref(db, 'users/' + userId);
    const coinsRef = ref(db, 'users/' + userId + '/coins');
    const energyRef = ref(db, 'users/' + userId + '/energy');

    // === Ініціалізація ===
    async function initUser() {
      const snap = await get(userRef);
      if (!snap.exists()) {
        await set(userRef, {
          coins: 0,
          profitPerHour: 100,
          energy: 1000,
          maxEnergy: 1000,
          lastMiningClaim: Date.now(),
          createdAt: Date.now()
        });
      }
    }

    // === Підписка ===
    function subscribeUser() {
      onValue(userRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        state.coins = data.coins || 0;
        state.profitPerHour = data.profitPerHour || 0;
        state.energy = data.energy ?? 1000;
        state.maxEnergy = data.maxEnergy ?? 1000;
        state.lastMiningClaim = data.lastMiningClaim || Date.now();

        coinDisplay.innerText = formatNumber(state.coins);
        profitDisplay.innerText = "+" + formatNumber(state.profitPerHour);
        energyDisplay.innerText = Math.floor(state.energy) + "/" + state.maxEnergy;

        const level = state.coins >= 1e9 ? "Creator" :
                      state.coins >= 1e8 ? "Legendary" :
                      state.coins >= 1e7 ? "Master" :
                      state.coins >= 1e6 ? "Gold" :
                      state.coins >= 1e5 ? "Silver" : "Bronze";
        document.getElementById('user-level').innerText = level;
      });
    }

    // === Тап по хом'яку ===
    hamster.addEventListener('click', async (e) => {
      if (isTapping) return;
      if (state.energy < 1) {
        showStatus("❌ Немає енергії! Зачекайте");
        return;
      }

      isTapping = true;

      // Анімація
      const rect = tapArea.getBoundingClientRect();
      const effect = document.createElement('div');
      effect.className = 'tap-effect';
      effect.innerText = '+1';
      effect.style.left = (e.clientX - rect.left - 10) + 'px';
      effect.style.top = (e.clientY - rect.top - 10) + 'px';
      tapArea.appendChild(effect);
      setTimeout(() => effect.remove(), 800);

      try { tg.HapticFeedback.impactOccurred('light'); } catch(e) {}

      try {
        // Атомарно +1 монета
        await runTransaction(coinsRef, (current) => (current || 0) + 1);
        // Атомарно -1 енергія
        await runTransaction(energyRef, (current) => Math.max(0, (current ?? 1000) - 1));
      } catch (err) {
        console.error("Tap error:", err);
        showStatus("❌ Помилка: " + err.message);
      } finally {
        isTapping = false;
      }
    });

    // === Відновлення енергії: +10 кожні 5 сек ===
    setInterval(async () => {
      if (state.energy >= state.maxEnergy) return;
      try {
        await runTransaction(energyRef, (current) => {
          const cur = current ?? 1000;
          return Math.min(state.maxEnergy, cur + 10);
        });
      } catch (err) { console.error(err); }
    }, 5000);

    // === Запуск ===
    (async () => {
      try {
        await initUser();
        subscribeUser();
        console.log("✅ Hamka Kombat запущено. UserID:", userId);
      } catch (err) {
        console.error("Init error:", err);
        showStatus("❌ Не вдалося підключитися до Firebase");
      }
    })();
  </script>
</body>
</html>
